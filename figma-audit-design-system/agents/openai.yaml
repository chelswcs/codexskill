interface:
  display_name: "Figma DS Audit"
  short_description: "Audit and normalize a Figma design system"
  brand_color: "#0A0A0A"
  default_prompt: "Use $figma-audit-design-system to inspect a Figma design system page, report mismatches with source evidence, fix them in small batches, then re-audit and summarize remaining issues."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: true

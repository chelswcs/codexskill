interface:
  display_name: "Figma DS Extraction"
  short_description: "Extract a design system from source screens"
  brand_color: "#0A0A0A"
  default_prompt: "Use $figma-extract-design-system to review Figma source screens, propose what to add or modify, then extract the design system in the correct order."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"

policy:
  allow_implicit_invocation: true
